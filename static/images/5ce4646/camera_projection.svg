<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590">
<title>Camera coordinates and perspective projection</title><desc>Right-handed camera frame: x toward the viewer down-left, y down, z toward the scene. Virtual image plane z=f. O, P prime and P are collinear.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2563a6"/></marker><marker id="b" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7Z" fill="#333"/></marker><style>text{font-family:'DejaVu Serif',serif;font-size:24px;fill:#222}.m{font-style:italic}.w{fill:none;stroke:#999;stroke-width:1.6;stroke-linejoin:round}.halo{paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}.axis{fill:#2563a6;font-style:italic;font-size:29px}</style></defs>
<rect width="1200" height="590" fill="white"/>
<g id="camera-body"><path class="w" d="M120 195L220 145L476 193L408 227 M120 475L220 425L476 393L408 427 M220 145V425 M476 193V393"/><path d="M120 195V475L408 427V227Z M120 195L220 145 M408 227L476 193" fill="none" stroke="#222" stroke-width="2.4"/><text x="25" y="306" font-size="21">image</text><text x="25" y="334" font-size="21">plane</text><path d="M120 80H408" stroke="#333" stroke-width="1.5" marker-start="url(#b)" marker-end="url(#b)"/><path d="M120 92V183 M408 92V212" stroke="#999" stroke-width="1.3" stroke-dasharray="5 5"/><text x="258" y="65" class="m">f</text><text x="390" y="485" font-size="22">pinhole</text><path d="M436 458L440 329" stroke="#999" stroke-dasharray="3 5"/></g>
<g id="virtual-image-plane"><path d="M660 195L760 145V425L660 475Z" fill="#edf5fc" fill-opacity=".65" stroke="#91a7ba" stroke-width="1.6" stroke-dasharray="4 3"/><text x="747" y="126" class="m" style="font-size:33px">Π′</text><text x="678" y="514" font-size="22">virtual image</text><text x="702" y="548" class="m" font-size="21">z = f</text></g>
<g id="candle" class="w"><path d="M950 224V416C953 438 1015 425 1020 403V212" fill="white"/><ellipse cx="985" cy="220" rx="36" ry="10" transform="rotate(-15 985 220)" fill="white"/><path d="M980 220C951 205 961 169 980 150C1004 174 1007 201 986 219 M980 219C969 208 973 190 980 187C990 196 990 211 980 219"/></g>
<g id="virtual-candle" class="w" stroke-dasharray="3 3"><path d="M695 267V365Q710 370 730 359V260 M695 267Q711 270 730 260 M710 265C696 254 701 237 710 230C724 243 723 257 710 265"/></g>
<g id="real-image" class="w"><path d="M155 350V260L190 246V340Z M170 355C156 366 162 382 170 390C185 375 183 360 170 355"/></g>
<g id="rays" stroke="#dc2929" stroke-width="2.7" fill="none"><path d="M170 390L980 150 M170 355L980 220 M185 255L950 420"/></g>
<g id="camera-axes" fill="none" stroke="#2563a6" stroke-width="2.2" marker-end="url(#a)"><path d="M440 310H1130"/><path d="M440 310V448"/><path d="M440 310L335 362"/></g>
<g id="axis-labels"><text x="1144" y="319" class="axis">z</text><text x="452" y="451" class="axis">y</text><text x="312" y="386" class="axis halo">x</text><circle cx="440" cy="310" r="5" fill="white" stroke="#222" stroke-width="2"/><text x="456" y="342" class="m halo">O</text><circle cx="710" cy="310" r="3" fill="#2563a6"/></g>
<g id="projection-points"><circle cx="980" cy="150" r="5" fill="#dc2929" stroke="white" stroke-width="1.4"/><text x="959" y="120" class="m halo">P(x, y, z)</text><circle cx="710" cy="230" r="5" fill="#dc2929" stroke="white" stroke-width="1.4"/><path d="M705 224L669 189" stroke="#555" stroke-width="1.1"/><text x="531" y="178" class="m halo">P′(x′, y′)</text></g>
<g id="focal-distance"><path d="M440 394V425 M710 394V425" stroke="#929eaa" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M446 413H704" stroke="#333" stroke-width="1.4" marker-start="url(#b)" marker-end="url(#b)"/><text x="567" y="403" class="m halo">f</text></g>
</svg>
